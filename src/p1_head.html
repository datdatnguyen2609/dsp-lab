<style>
/* Layout: bàn thí nghiệm — mục lục cố định bên trái, cột lý thuyết ~68ch, khung demo rộng như màn hình máy hiện sóng. */
:root {
  --paper: #eef2f4;
  --panel: #ffffff;
  --panel-2: #f6f8fa;
  --ink: #15212c;
  --muted: #586774;
  --line: #ccd5dd;
  --grid: #e2e8ed;
  --trace: #1d63c4;      /* tín hiệu liên tục */
  --sample: #d4570f;     /* mẫu rời rạc */
  --a3: #0f8a63;         /* kết quả / đầu ra */
  --a4: #a8327f;         /* phụ trợ */
  --warn: #b7791f;
  --bad: #c0392b;
  --good: #0f8a63;
  --hl: rgba(29, 99, 196, .10);
  --f-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body: "Be Vietnam Pro", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1418; --panel: #151d23; --panel-2: #1a242c; --ink: #e2e9ee; --muted: #93a2ae;
    --line: #2b3943; --grid: #202c35; --trace: #5ea4ff; --sample: #ff9450; --a3: #3dcf98; --a4: #e57cc6;
    --warn: #e0a84a; --bad: #ff6f61; --good: #3dcf98; --hl: rgba(94, 164, 255, .12);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1418; --panel: #151d23; --panel-2: #1a242c; --ink: #e2e9ee; --muted: #93a2ae;
  --line: #2b3943; --grid: #202c35; --trace: #5ea4ff; --sample: #ff9450; --a3: #3dcf98; --a4: #e57cc6;
  --warn: #e0a84a; --bad: #ff6f61; --good: #3dcf98; --hl: rgba(94, 164, 255, .12);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  background: var(--paper); color: var(--ink); font-family: var(--f-body);
  font-size: 16px; line-height: 1.65; margin: 0;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--panel); }
a { color: var(--trace); }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.2; text-wrap: balance; margin: 0; }
code, .mono { font-family: var(--f-mono); font-size: .88em; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--trace); outline-offset: 2px; }

/* ---------- khung trang ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--panel); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 12px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.brand { font-family: var(--f-display); font-weight: 700; font-size: 17px; display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.brand svg { flex: none; }
.progress { flex: 1; height: 6px; background: var(--grid); border-radius: 3px; overflow: hidden; min-width: 40px; }
.progress > i { display: block; height: 100%; width: 0; background: var(--a3); transition: width .4s; }
.prog-txt { font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.iconbtn { border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); border-radius: 8px; padding: 6px 10px; cursor: pointer; font: inherit; font-size: 13px; }
.iconbtn:hover { border-color: var(--trace); }
#menuBtn { display: none; }

.shell {
  display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 32px;
  max-width: 1280px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
nav.toc {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 58px); align-self: start;
  max-height: calc(100vh - 70px); overflow-y: auto; padding-block: 20px; font-size: 14px;
}
.toc h4 { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 18px 0 6px; font-family: var(--f-body); font-weight: 600; }
.toc h4:first-child { margin-top: 0; }
.toc a { display: flex; gap: 8px; align-items: baseline; padding: 5px 8px; border-radius: 6px; color: var(--ink); text-decoration: none; }
.toc a:hover { background: var(--hl); }
.toc a.active { background: var(--hl); color: var(--trace); font-weight: 600; }
.toc a .n { font-family: var(--f-mono); font-size: 11px; color: var(--muted); min-width: 20px; }
.toc a .ok { margin-left: auto; color: var(--a3); font-size: 12px; visibility: hidden; }
.toc a.done .ok { visibility: visible; }

main { min-width: 0; padding-block: 24px 80px; }

/* ---------- hero ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 28px; align-items: center; padding-block: 12px 36px; border-bottom: 1px solid var(--line); }
.hero .eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--sample); font-weight: 600; }
.hero h1 { font-size: clamp(32px, 4.6vw, 52px); margin: 8px 0 14px; letter-spacing: -.02em; }
.hero p { color: var(--muted); max-width: 60ch; }
.hero .scope { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; }
.hero .scope .cap { font-family: var(--f-mono); font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 2px 4px 6px; }
.roadmap { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-top: 24px; }
.roadmap a { text-decoration: none; color: inherit; border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); padding: 12px 14px; display: block; }
.roadmap a:hover { border-color: var(--trace); }
.roadmap b { font-family: var(--f-display); display: block; font-size: 15px; }
.roadmap span { font-size: 13px; color: var(--muted); }

/* ---------- chương ---------- */
.part-title { margin: 56px 0 0; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--sample); font-weight: 600; font-family: var(--f-body); }
section.ch { padding-top: 28px; scroll-margin-top: 70px; display: grid; gap: 18px; }
section.ch > h2 { font-size: clamp(24px, 3vw, 32px); display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
section.ch > h2 .no { font-family: var(--f-mono); font-size: .55em; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; }
section.ch h3 { font-size: 19px; margin-top: 10px; }
.prose { max-width: 72ch; display: grid; gap: 12px; }
.prose ul, .prose ol { margin: 0; padding-left: 1.3em; display: grid; gap: 4px; }
.lead { font-size: 17px; color: var(--muted); max-width: 72ch; }
.key { border-left: 3px solid var(--trace); background: var(--panel); padding: 12px 16px; border-radius: 0 var(--r) var(--r) 0; max-width: 72ch; }
.key.warn { border-color: var(--warn); }
.key.good { border-color: var(--a3); }
.key b:first-child { font-family: var(--f-display); }
.mathbox { overflow-x: auto; overflow-y: hidden; max-width: 100%; }
mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; max-width: 100%; padding-block: 2px; }

/* ---------- stepper (dẫn giải từng bước) ---------- */
.stepper { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 12px; max-width: 860px; }
.stepper .sh { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.stepper .sh h4 { font-size: 15px; }
.stepper ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; counter-reset: st; }
.stepper li { counter-increment: st; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; padding: 10px 12px; border-radius: 8px; border: 1px solid transparent; }
.stepper li::before { content: counter(st); font-family: var(--f-mono); font-size: 12px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--grid); color: var(--muted); margin-top: 2px; }
.stepper li.cur { border-color: var(--trace); background: var(--hl); }
.stepper li.cur::before { background: var(--trace); color: var(--panel); }
.stepper li > div { min-width: 0; display: grid; gap: 6px; }
.stepper li .why { font-size: 14px; color: var(--muted); }
.stepper li.enter { animation: rise .35s ease; }
@keyframes rise { from { opacity: .2; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .stepper li.enter { animation: none; } }
.stepbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stepbar .count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; margin-right: auto; }

/* ---------- khung demo ---------- */
.lab { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.lab-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel-2); flex-wrap: wrap; }
.lab-h b { font-family: var(--f-display); font-size: 15px; }
.lab-h .tag { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--sample); font-weight: 600; }
.lab-b { padding: 14px 16px 16px; display: grid; gap: 14px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: end; }
.ctl { display: grid; gap: 2px; font-size: 13px; color: var(--muted); min-width: 150px; flex: 1 1 160px; max-width: 280px; }
.ctl .lbl { display: flex; justify-content: space-between; gap: 6px; }
.ctl output { color: var(--ink); font-family: var(--f-mono); font-size: 12px; font-variant-numeric: tabular-nums; }
.ctl input[type=range] { width: 100%; accent-color: var(--trace); }
.ctl select, .ctl input[type=text], .ctl input[type=number] { font: inherit; font-size: 14px; color: var(--ink); background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; }
.ctl.wide { max-width: 420px; flex-basis: 260px; }
.chk { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--ink); }
.btn { font: inherit; font-size: 14px; border: 1px solid var(--trace); background: var(--trace); color: var(--panel); border-radius: 8px; padding: 7px 14px; cursor: pointer; font-weight: 600; }
.btn.ghost { background: transparent; color: var(--trace); }
.btn:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: default; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
canvas.plot { width: 100%; display: block; border-radius: 6px; touch-action: none; }
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.cols3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.cap { font-size: 12px; color: var(--muted); }
.readout { font-family: var(--f-mono); font-size: 13px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; white-space: pre; line-height: 1.6; font-variant-numeric: tabular-nums; }
.readout.wrap { white-space: pre-wrap; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 99px; border: 1px solid currentColor; }
.pill.good { color: var(--good); } .pill.bad { color: var(--bad); } .pill.warn { color: var(--warn); }
.c-trace { color: var(--trace); } .c-sample { color: var(--sample); } .c-a3 { color: var(--a3); } .c-a4 { color: var(--a4); }

table.t { border-collapse: collapse; font-size: 14px; width: 100%; }
.tbl { overflow-x: auto; max-width: 100%; }
table.t th, table.t td { border-bottom: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top; }
table.t th { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
table.t td.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* ---------- quiz ---------- */
.quiz { background: var(--panel); border: 1px dashed var(--line); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 16px; max-width: 860px; }
.quiz > h4 { font-size: 15px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.quiz > h4 span { font-family: var(--f-body); font-size: 13px; color: var(--muted); font-weight: 500; }
.q { display: grid; gap: 8px; }
.q .qt { font-weight: 600; }
.q .opts { display: grid; gap: 6px; }
.q button.opt { text-align: left; font: inherit; font-size: 15px; color: var(--ink); background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
.q button.opt:hover:not(:disabled) { border-color: var(--trace); }
.q button.opt.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--panel)); }
.q button.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--panel)); }
.q button.opt:disabled { cursor: default; }
.q .exp { font-size: 14px; color: var(--muted); border-left: 3px solid var(--a3); padding-left: 10px; }

/* ---------- FPGA bit editor ---------- */
.bits { display: flex; flex-wrap: wrap; gap: 3px; align-items: flex-end; }
.bit { display: grid; gap: 2px; text-align: center; }
.bit button { width: 30px; height: 34px; font-family: var(--f-mono); font-size: 15px; border-radius: 5px; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); cursor: pointer; }
.bit button.on { background: var(--trace); color: var(--panel); border-color: var(--trace); }
.bit.sign button.on { background: var(--a4); border-color: var(--a4); }
.bit small { font-family: var(--f-mono); font-size: 10px; color: var(--muted); }
.bit.point { width: 6px; align-self: stretch; border-left: 2px dotted var(--sample); margin: 0 3px; }
pre.code { font-family: var(--f-mono); font-size: 13px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; overflow-x: auto; margin: 0; line-height: 1.55; }

.summary-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.summary-grid > div { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; min-width: 0; display: grid; gap: 6px; align-content: start; }
.summary-grid b { font-family: var(--f-display); }
footer { margin-top: 56px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }

@media (max-width: 980px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  #menuBtn { display: inline-block; }
  nav.toc { position: fixed; z-index: 25; top: calc(env(safe-area-inset-top, 0px) + 52px); left: 0; bottom: 0; width: min(300px, 86vw); max-height: none; background: var(--panel); border-right: 1px solid var(--line); padding: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); transform: translateX(-105%); transition: transform .25s; }
  nav.toc.open { transform: none; }
  .hero { grid-template-columns: minmax(0, 1fr); }

}
@media (max-width: 640px) {
  .cols, .cols3 { grid-template-columns: minmax(0, 1fr); }
  .prog-txt { display: none; }
  .ctl { max-width: none; }
  .stepper, .quiz { padding: 12px; }
  .stepper li { grid-template-columns: minmax(0, 1fr); }
  .stepper li::before { display: none; }
}
</style>
